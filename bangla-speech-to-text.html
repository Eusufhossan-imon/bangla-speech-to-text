<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা ভয়েস টু টেক্সট (Speech to Text)</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card);
            width: 100%;
            max-width: 750px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 15px;
            background: #f8fafc;
            color: var(--text);
            outline: none;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            background: #e2e8f0;
            color: #475569;
        }

        .status-badge.recording {
            background: #fee2e2;
            color: var(--danger);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .recording .pulse-dot {
            background: var(--danger);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .editor-box {
            position: relative;
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 260px;
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .interim-preview {
            min-height: 28px;
            padding: 6px 12px;
            margin-bottom: 16px;
            background: #f8fafc;
            border-left: 3px solid var(--primary);
            color: #64748b;
            font-size: 15px;
            font-style: italic;
            border-radius: 4px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            flex: 1;
            min-width: 130px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: var(--primary);
            color: white;
        }

        .btn-start:hover {
            background: var(--primary-hover);
        }

        .btn-start.active {
            background: var(--danger);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .error-msg {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>বাংলা ভয়েস টু টেক্সট</h1>
        <p>মাইক্রোফোনে বাংলায় কথা বলুন, স্বয়ংক্রিয়ভাবে লেখায় রূপান্তর হবে</p>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <div class="controls-top">
        <div>
            <label for="dialectSelect">ভাষার ধরন: </label>
            <select id="dialectSelect">
                <option value="bn-BD" selected>বাংলা (বাংলাদেশ)</option>
                <option value="bn-IN">বাংলা (ভারত)</option>
            </select>
        </div>

        <div id="statusBadge" class="status-badge">
            <span class="pulse-dot"></span>
            <span id="statusText">প্রস্তুত</span>
        </div>
    </div>

    <div class="editor-box">
        <textarea id="outputText" placeholder="এখানে আপনার বলা কথা লেখা আকারে দেখা যাবে... (আপনি চাইলে সরাসরি এডিটও করতে পারবেন)"></textarea>
    </div>

    <div id="interimText" class="interim-preview">কথা বলার জন্য নিচের "রেকর্ডিং শুরু করুন" বাটনে চাপ দিন...</div>

    <div class="stats">
        <span id="wordCount">শব্দ: ০</span>
        <span id="charCount">অক্ষর: ০</span>
    </div>

    <div class="button-group">
        <button id="toggleBtn" class="btn-start">🎙️ রেকর্ডিং শুরু করুন</button>
        <button id="copyBtn" class="btn-secondary">📋 কপি করুন</button>
        <button id="downloadBtn" class="btn-secondary">💾 সেভ (.txt)</button>
        <button id="clearBtn" class="btn-secondary">🗑️ মুছে ফেলুন</button>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    const toggleBtn = document.getElementById('toggleBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const outputText = document.getElementById('outputText');
    const interimText = document.getElementById('interimText');
    const dialectSelect = document.getElementById('dialectSelect');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const errorBox = document.getElementById('errorBox');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');

    let isRecording = false;
    let recognition = null;

    // বাংলা সংখ্যায় রূপান্তর ফাংশন
    function toBengaliNumber(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().replace(/\d/g, d => bengaliDigits[d]);
    }

    function updateStats() {
        const text = outputText.value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = outputText.value.length;
        wordCount.textContent = `শব্দ: ${toBengaliNumber(words)}`;
        charCount.textContent = `অক্ষর: ${toBengaliNumber(chars)}`;
    }

    outputText.addEventListener('input', updateStats);

    if (!SpeechRecognition) {
        errorBox.style.display = 'block';
        errorBox.textContent = 'দুঃখিত, আপনার ব্রাউজারটি ভয়েস রিকগনিশন সাপোর্ট করে না। অনুগ্রহ করে Google Chrome বা Microsoft Edge ব্যবহার করুন।';
        toggleBtn.disabled = true;
    } else {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = dialectSelect.value;

        dialectSelect.addEventListener('change', () => {
            recognition.lang = dialectSelect.value;
            if (isRecording) {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            isRecording = true;
            statusBadge.classList.add('recording');
            statusText.textContent = 'শুনছি... কথা বলুন';
            toggleBtn.textContent = '⏹️ রেকর্ডিং থামান';
            toggleBtn.classList.add('active');
            interimText.textContent = 'আপনার কথা শোনা হচ্ছে...';
            errorBox.style.display = 'none';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript + ' ';
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) {
                const currentVal = outputText.value;
                const needsSpace = currentVal.length > 0 && !currentVal.endsWith(' ') && !currentVal.endsWith('\n');
                outputText.value += (needsSpace ? ' ' : '') + finalTranscript;
                updateStats();
            }

            interimText.textContent = interimTranscript || 'কথা বলুন...';
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                errorBox.style.display = 'block';
                errorBox.textContent = 'মাইক্রোফোন ব্যবহারের অনুমতি দেওয়া হয়নি। ব্রাউজারের সেটিংস থেকে মাইক্রোফোন Allow করুন।';
                stopRecordingUI();
            } else if (event.error !== 'no-speech') {
                errorBox.style.display = 'block';
                errorBox.textContent = 'ত্রুটি: ' + event.error;
            }
        };

        recognition.onend = () => {
            if (isRecording) {
                try {
                    recognition.start();
                } catch (e) {
                    stopRecordingUI();
                }
            } else {
                stopRecordingUI();
            }
        };
    }

    function stopRecordingUI() {
        isRecording = false;
        statusBadge.classList.remove('recording');
        statusText.textContent = 'বন্ধ আছে';
        toggleBtn.textContent = '🎙️ রেকর্ডিং শুরু করুন';
        toggleBtn.classList.remove('active');
        interimText.textContent = 'রেকর্ডিং বন্ধ রয়েছে।';
    }

    toggleBtn.addEventListener('click', () => {
        if (isRecording) {
            isRecording = false;
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }
    });

    copyBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        navigator.clipboard.writeText(outputText.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ কপি হয়েছে!';
        setTimeout(() => copyBtn.textContent = originalText, 2000);
    });

    downloadBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        const blob = new Blob([outputText.value], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bangla-transcript-${new Date().toISOString().slice(0,10)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener('click', () => {
        if (outputText.value && confirm('আপনি কি সব লেখা মুছে ফেলতে চান?')) {
            outputText.value = '';
            updateStats();
        }
    });
</script>

</body>
</html>
